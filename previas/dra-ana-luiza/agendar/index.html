<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agende sua consulta · Dra. Ana Luiza Costa</title>
<meta name="description" content="Escolha o melhor dia e horário e envie seu pedido de consulta pelo WhatsApp.">
<meta name="theme-color" content="#efe7dc">
<meta property="og:title" content="Agende sua consulta · Dra. Ana Luiza Costa">
<meta property="og:description" content="Escolha o melhor dia e horário em poucos toques.">
<meta property="og:image" content="../logo.jpg">
<link rel="icon" href="../icon-180.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe7dc;--panel:#fbf7f1;--panel2:#f4ece1;--line:#8b5a2b22;--line2:#8b5a2b40;--text:#3a2717;--muted:#8a6d55;--dim:#a8907a;--acc:#8b5a2b;--wa:#1f8f55;--bad:#c2463d;--r:16px}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
header{text-align:center;display:grid;gap:10px;justify-items:center;padding:6px 0 18px}
header .logo-ouro{display:block;width:min(270px,74%);aspect-ratio:964/390;-webkit-mask:url(../logo-t.png) center/100% 100% no-repeat;mask:url(../logo-t.png) center/100% 100% no-repeat;background:linear-gradient(115deg,#5e3818 0%,#8b5a2b 16%,#c08a4e 28%,#e0b479 34%,#b07a43 42%,#6e4320 55%,#9a6532 67%,#d2a266 75%,#8b5a2b 87%,#5e3818 100%);background-size:260% 100%;animation:ouroLogo 8s ease-in-out infinite alternate;filter:drop-shadow(0 1px 0 rgba(255,250,240,.9)) drop-shadow(0 4px 8px rgba(110,67,32,.25))}@keyframes ouroLogo{from{background-position:0% 50%}to{background-position:100% 50%}}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;color:var(--acc);letter-spacing:-.01em;line-height:1.05}
header p{color:var(--muted);font-size:14px;line-height:1.55;max-width:400px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;display:grid;gap:12px}
.step h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.step h2 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:0}
.step.off{opacity:.45;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--line2);background:#fffdf9;font-size:14px;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 66px;scroll-snap-align:start;display:grid;justify-items:center;gap:2px;padding:10px 0;border-radius:14px;border:1px solid var(--line2);background:#fffdf9}
.day small{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:600;letter-spacing:.04em}
.day b{font-size:20px;font-weight:700}.day span{font-size:10px;color:var(--dim)}
.day.on{background:var(--acc);border-color:var(--acc);color:#fff}.day.on small,.day.on span{color:#f4e6d6}
.day:disabled{opacity:.35}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:380px){.times{grid-template-columns:repeat(3,1fr)}}
.time{padding:11px 0;border-radius:12px;border:1px solid var(--line2);background:#fffdf9;font-weight:600;font-size:14px}
.time.on{background:var(--acc);border-color:var(--acc);color:#fff}
label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input,textarea{width:100%;background:#fffdf9;border:1px solid var(--line2);border-radius:12px;padding:12px 13px;font-size:16px;outline:none}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #8b5a2b22}
textarea{min-height:70px;resize:vertical}
.msg{color:var(--muted);text-align:center;font-size:14px;line-height:1.55;padding:10px 4px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#efe7dcf2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bar>div{max-width:560px;margin:0 auto;display:grid;gap:6px}
.resumo{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;background:var(--wa);color:#fff;font-weight:700;font-size:15px;letter-spacing:.01em}
.go:disabled{background:#b9ab9b}
.err{color:var(--bad);font-size:13px;text-align:center;min-height:16px}
footer{margin-top:22px;text-align:center;font-size:12px;color:var(--dim);line-height:1.6}
.skel{height:64px;border-radius:14px;background:linear-gradient(90deg,#f4ece1,#fbf7f1,#f4ece1);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <span class="logo-ouro" role="img" aria-label="Dra. Ana Luiza Costa, cirurgiã-dentista"></span>
  <h1>Agende sua consulta</h1>
  <p>Escolha o atendimento, o dia e o horário. Seu pedido chega no WhatsApp do consultório e a confirmação vem em seguida.</p>
 </header>
 <main id="app"><div class="step"><div class="skel"></div><div class="skel"></div></div></main>
 <footer>Seus dados vão só para o WhatsApp do consultório.<br>Dra. Ana Luiza Costa · Cirurgiã-dentista</footer>
</div>
<div class="bar hidden" id="bar"><div><div class="resumo" id="resumo"></div><div class="err" id="err"></div><button class="go" id="go" disabled>
 <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.3Z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1.5-1.5-2-1-1 1c-1.5-.5-2.5-1.5-3-3l1-1-1-2Z"/></svg>
 Enviar pedido pelo WhatsApp</button></div></div>
<script>
(()=>{'use strict';
/* Página pública de agendamento. Lê só os horários ocupados (sem nomes) que o painel publica em agenda-publica.json.
   O pedido vai pelo WhatsApp com um link que a doutora toca para lançar a consulta no painel. */
const OWNER='arnoldsuheth',REPO='dra-ana-luiza-app-previa-inexistente',FILE='agenda-publica.json',PAINEL='https://arnoldsuheth.github.io/studio-evolution-gestao-app/previas/dra-ana-luiza/';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const min=h=>{const[a,b]=h.split(':').map(Number);return a*60+b},hh=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dt=s=>new Date(s+'T12:00:00');
const diaLongo=s=>dt(s).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});
let C=null,OC=[],esc_={proc:'',dia:'',hora:''};

async function carregar(){
 const tentativas=[
  ()=>fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}?t=${Date.now()}`,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'}),
  ()=>fetch(`../${FILE}?t=${Date.now()}`,{cache:'no-store'})];
 for(const t of tentativas){try{const r=await t();if(r.ok)return await r.json()}catch{}}
 return null}

function slots(dia){const c=C.cfg,step=+c.intervalo||30,ini=min(c.inicio),fim=min(c.fim);
 const pI=c.pausaIni&&c.pausaFim?min(c.pausaIni):null,pF=pI!==null?min(c.pausaFim):null;
 const limite=Date.now()+(+c.antecedenciaH||0)*36e5;
 const ocup=OC.filter(o=>o.d===dia).map(o=>[min(o.h),min(o.h)+(+o.m||step)]);
 const out=[];for(let t=ini;t+step<=fim;t+=step){
  if(pI!==null&&t<pF&&t+step>pI)continue;
  if(ocup.some(([a,b])=>t<b&&t+step>a))continue;
  if(new Date(dia+'T'+hh(t)+':00').getTime()<limite)continue;
  out.push(hh(t))}
 return out}
function dias(){const c=C.cfg,n=(+c.semanas||3)*7,out=[],d=new Date();
 for(let i=0;i<=n;i++){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+i,12);const s=iso(x);
  if(!c.dias.includes(x.getDay())||(c.folgas||[]).includes(s))continue;out.push({s,livres:slots(s).length})}
 return out}

function indisponivel(){app.innerHTML=`<div class="step"><p class="msg">O agendamento online está pausado no momento.<br>Fale direto com o consultório pelo WhatsApp.</p>${C?.cfg?.whatsapp?`<a class="go" style="text-decoration:none" href="https://wa.me/55${C.cfg.whatsapp}?text=${encodeURIComponent('Olá! Gostaria de agendar uma consulta.')}">Chamar no WhatsApp</a>`:''}</div>`}

function render(){const c=C.cfg,lista=dias();
 if(!esc_.dia){const p=lista.find(d=>d.livres);if(p)esc_.dia=p.s}
 const horas=esc_.dia?slots(esc_.dia):[];if(!horas.includes(esc_.hora))esc_.hora='';
 app.innerHTML=`
 <section class="step"><h2><i>1</i> Atendimento</h2><div class="chips">${c.procedimentos.map(p=>`<button class="chip ${p===esc_.proc?'on':''}" data-proc="${esc(p)}">${esc(p)}</button>`).join('')}</div></section>
 <section class="step"><h2><i>2</i> Dia</h2>${lista.some(d=>d.livres)?`<div class="days">${lista.map(d=>{const x=dt(d.s);return `<button class="day ${d.s===esc_.dia?'on':''}" data-dia="${d.s}" ${d.livres?'':'disabled'}><small>${x.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</small><b>${d.s.slice(8)}</b><span>${x.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</span></button>`}).join('')}</div>`:'<p class="msg">Sem horários livres nas próximas semanas. Chame no WhatsApp que encaixamos você.</p>'}</section>
 <section class="step ${esc_.dia?'':'off'}"><h2><i>3</i> Horário${esc_.dia?' · '+esc(diaLongo(esc_.dia)):''}</h2>${horas.length?`<div class="times">${horas.map(h=>`<button class="time ${h===esc_.hora?'on':''}" data-hora="${h}">${h}</button>`).join('')}</div>`:'<p class="msg">Escolha um dia acima.</p>'}</section>
 <section class="step"><h2><i>4</i> Seus dados</h2>
  <label>Nome completo<input id="nome" autocomplete="name" maxlength="80" value="${esc(localGet('nome'))}"></label>
  <label>Seu WhatsApp (com DDD)<input id="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="(11) 99999-9999" value="${esc(localGet('tel'))}"></label>
  <label>Quer contar algo? (opcional)<textarea id="obs" maxlength="200" placeholder="Ex.: sensibilidade num dente, primeira consulta…"></textarea></label>
 </section>`;
 app.querySelectorAll('[data-proc]').forEach(b=>b.onclick=()=>{esc_.proc=b.dataset.proc;render()});
 app.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{esc_.dia=b.dataset.dia;esc_.hora='';render()});
 app.querySelectorAll('[data-hora]').forEach(b=>b.onclick=()=>{esc_.hora=b.dataset.hora;render()});
 const on=app.querySelector('.day.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
 ['nome','tel'].forEach(id=>$('#'+id).oninput=atualizar);atualizar()}
function localGet(k){try{return localStorage.getItem('agendar_'+k)||''}catch{return ''}}
function localSet(k,v){try{localStorage.setItem('agendar_'+k,v)}catch{}}
function atualizar(){$('#bar').classList.remove('hidden');
 const falta=!esc_.proc?'Escolha o atendimento':!esc_.dia?'Escolha o dia':!esc_.hora?'Escolha o horário':'';
 $('#resumo').textContent=falta||`${esc_.proc} · ${diaLongo(esc_.dia)} às ${esc_.hora}`;$('#go').disabled=!!falta;$('#err').textContent=''}

$('#go').onclick=()=>{const nome=$('#nome').value.trim(),tel=$('#tel').value.replace(/\D/g,''),obs=$('#obs').value.trim();
 if(nome.length<3){$('#err').textContent='Escreva seu nome.';$('#nome').focus();return}
 if(tel.length<10){$('#err').textContent='Escreva seu WhatsApp com DDD.';$('#tel').focus();return}
 localSet('nome',nome);localSet('tel',tel);
 const ped={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),n:nome,t:tel,d:esc_.dia,h:esc_.hora,s:esc_.proc,o:obs};
 const bytes=new TextEncoder().encode(JSON.stringify(ped));let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));
 const code=btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const texto=`Olá! Gostaria de agendar uma consulta.\n\n*Nome:* ${nome}\n*Atendimento:* ${esc_.proc}\n*Dia:* ${diaLongo(esc_.dia)}, às ${esc_.hora}${obs?`\n*Obs.:* ${obs}`:''}\n\nLink para o consultório lançar na agenda:\n${PAINEL}#pedido=${code}`;
 location.href='https://wa.me/55'+C.cfg.whatsapp+'?text='+encodeURIComponent(texto)};

(async()=>{C=await carregar();
 if(!C||!C.cfg||!C.cfg.ativo||!C.cfg.whatsapp)return indisponivel();
 OC=C.ocupados||[];if(C.cfg.procedimentos?.length===1)esc_.proc=C.cfg.procedimentos[0];render()})();
})();
</script>
<style>.hidden{display:none}</style>
</body>
</html>
